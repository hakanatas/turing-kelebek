<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turing Kelebek Çalışma Rehberi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Düzen: solda ünite haritası (ilerleme halkalarıyla), ortada okunur ders sütunu; widget'lar sütunu doldurur; telefonda harita üstte açılır menü */
:root{
  --bg:#EDF0EA; --surface:#FBFCF9; --sunk:#E3E8E0; --ink:#1C2220; --muted:#59625D; --line:#CBD2CA;
  --signal:#1F7A8C; --s-col:#B8336A; --lam-col:#4B3BC4; --ok:#2E7D32; --bad:#B3261E; --warn:#9A5B00;
  --ok-bg:#E3F1E2; --bad-bg:#F8E3E1; --warn-bg:#F6ECD9;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1A201D; --sunk:#232B27; --ink:#E6EBE5; --muted:#9BA69F; --line:#2E3833;
  --signal:#4FB8CC; --s-col:#F0729E; --lam-col:#9C8EFF; --ok:#6CC070; --bad:#F2766D; --warn:#E3A43C;
  --ok-bg:#1D2E1E; --bad-bg:#35201E; --warn-bg:#33291A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A201D; --sunk:#232B27; --ink:#E6EBE5; --muted:#9BA69F; --line:#2E3833;
  --signal:#4FB8CC; --s-col:#F0729E; --lam-col:#9C8EFF; --ok:#6CC070; --bad:#F2766D; --warn:#E3A43C;
  --ok-bg:#1D2E1E; --bad-bg:#35201E; --warn-bg:#33291A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;margin:0}
a{color:var(--signal)}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);padding:1px 5px;border-radius:4px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
/* kenar çubuğu */
.side{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:18px 14px 24px;display:flex;flex-direction:column;gap:14px}
.brand{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);margin-top:4px}
.overall{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--signal);border-radius:99px;transition:width .4s}
.units{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.units a{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.25}
.units a:hover{background:var(--sunk)}
.units a[aria-current="page"]{background:var(--ink);color:var(--surface)}
.units .no{font-family:var(--f-mono);font-size:12px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line)}
.units a.visited .no{border-color:var(--signal)}
.units a.passed .no{background:var(--ok);border-color:var(--ok);color:#fff}
.units .sc{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.units a[aria-current="page"] .sc{color:inherit;opacity:.8}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);display:grid;gap:6px}
.menu-btn{display:none}
/* ana sütun */
main{min-width:0;padding:28px 24px 80px}
.col{max-width:820px;margin:0 auto;display:grid;gap:26px}
.u-head{display:grid;gap:8px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--signal)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4.6vw,46px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3vw,28px);line-height:1.15;margin:0 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:16px 0 6px}
.lead{font-size:19px;color:var(--muted);margin:0;max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;font-size:13px}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--muted)}
.goals{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.goals b{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.goals ul{margin:6px 0 0;padding-left:0;list-style:none;display:grid;gap:4px}
.goals li{display:grid;grid-template-columns:22px 1fr;gap:6px}
.goals li::before{content:"◎";color:var(--signal)}
section.sec p,section.sec li{max-width:66ch}
section.sec ul,section.sec ol{padding-left:22px}
section.sec li{margin-bottom:4px}
.s{color:var(--s-col);font-weight:700}.l{color:var(--lam-col);font-weight:700}
.key{border-left:4px solid var(--signal);background:var(--surface);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0}
.key b.t{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--signal)}
.analogy{border-left-color:var(--warn)}.analogy b.t{color:var(--warn)}
.formula{font-family:var(--f-mono);font-size:16px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;overflow-x:auto;white-space:nowrap}
table.t{border-collapse:collapse;width:100%;font-size:15px}
.tw{overflow-x:auto}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{font-size:13px;color:var(--muted);font-weight:700}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:14px}
/* widget */
.w{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;margin:14px 0}
.w .wt{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.w .wt b{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--signal)}
.w canvas{width:100%;height:auto;display:block;border-radius:8px;touch-action:none}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:15px}
.ctrl label{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0}
.ctrl input[type=range]{flex:1;min-width:0;accent-color:var(--signal)}
.ctrl input[type=number],.ctrl input[type=text]{font:inherit;width:110px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.sv{font-family:var(--f-mono);font-size:14px;min-width:70px;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.on{background:var(--signal);border-color:var(--signal);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.ro-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.ro{background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted)}
.ro b{display:block;font-family:var(--f-mono);font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.ro.hl{outline:2px solid var(--signal)}
.msg{font-size:15px;padding:8px 12px;border-radius:8px;background:var(--sunk)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.bad{background:var(--bad-bg);color:var(--bad)}.msg.warn{background:var(--warn-bg);color:var(--warn)}
/* hızlı kontrol ve sınav */
.check,.quiz{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.check>.qh,.quiz>.qh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--warn-bg);color:var(--warn)}
.quiz{border-color:var(--signal)}
.quiz .tag{background:var(--signal);color:#fff}
.qitem{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0}
.qtext{font-weight:700}
.qtext .qn{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-right:6px;font-weight:500}
.opts{display:grid;gap:6px}
.opt{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;text-align:left;font:inherit;font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);margin-top:3px}
.opt[aria-pressed="true"]{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal)}
.opt[aria-pressed="true"] .dot{background:var(--signal);border-color:var(--signal)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.match{display:grid;gap:6px}
.match .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.match select{font:inherit;font-size:15px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:100%}
.match .row.right select{border-color:var(--ok)}.match .row.wrong select{border-color:var(--bad)}
.ex{font-size:15px;background:var(--sunk);border-radius:8px;padding:8px 12px}
.ex.ok{background:var(--ok-bg)}.ex.bad{background:var(--bad-bg)}
.score{font-family:var(--f-display);font-weight:800;font-size:28px}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* kartlar */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.card h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:17px}
.card p{margin:0;font-size:15px;color:var(--muted)}
.flip{cursor:pointer;min-height:130px;text-align:left;font:inherit;color:var(--ink)}
.flip .back{display:none}.flip.open .back{display:block}.flip.open .front-hint{display:none}
.front-hint{font-size:13px;color:var(--signal)}
.tasklist{display:grid;gap:6px;list-style:none;padding:0;margin:0}
.tasklist label{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;background:var(--bg);padding:7px 10px;border-radius:8px;cursor:pointer}
.tasklist input{margin-top:5px;accent-color:var(--ok)}
.timeline{display:grid;gap:8px}
.phase{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid transparent;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.phase .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.phase.now{border-color:var(--signal);background:var(--surface)}
.phase.done{opacity:.7}
.phase .det{grid-column:1/-1;font-size:15px;color:var(--muted)}
.nextnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.report{display:grid;gap:8px}
.report .r{display:grid;grid-template-columns:minmax(0,1fr) 120px 60px;gap:10px;align-items:center;font-size:15px}
.badge{display:inline-grid;place-items:center;font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:99px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.no{background:var(--sunk);color:var(--muted)}
/* çözülmüş örnek, derinleşme, özet */
.worked{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:0 10px 10px 0;padding:10px 14px;margin:12px 0}
.worked>b.t{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);margin-bottom:4px}
.worked ol{margin:6px 0 0;padding-left:22px;display:grid;gap:4px}
.worked .q{font-weight:700}
details.deep{background:var(--sunk);border-radius:12px;padding:10px 14px;margin:14px 0}
details.deep>summary{cursor:pointer;font-weight:700;color:var(--lam-col)}
details.deep>summary small{font-weight:400;color:var(--muted)}
details.deep[open]>summary{margin-bottom:8px}
.recap{background:var(--ok-bg);border-radius:12px;padding:12px 16px}
.recap b.t{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ok)}
.recap ul{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.lvl{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;margin-left:8px;vertical-align:middle;background:var(--sunk);color:var(--muted)}
/* sembol kartı ve sözlük paneli */
dialog#ref{border:1px solid var(--line);border-radius:16px;padding:0;max-width:min(760px,calc(100vw - 32px));width:100%;max-height:85vh;background:var(--surface);color:var(--ink)}
dialog#ref::backdrop{background:rgba(0,0,0,.4)}
#ref .rh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
#ref .rb{padding:12px 16px;overflow:auto;max-height:calc(85vh - 64px)}
#ref table{border-collapse:collapse;width:100%;font-size:15px}
#ref td,#ref th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
#ref td:first-child{font-family:var(--f-mono);white-space:nowrap;font-weight:700}
#ref dl{display:grid;gap:2px;margin:0}
#ref dl div{padding:6px 0;border-bottom:1px solid var(--line)}
#ref dt{font-weight:700}#ref dd{margin:0;color:var(--muted);font-size:15px}
#refSearch{font:inherit;font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;margin-bottom:8px}
.ident{background:var(--surface);border:2px solid var(--warn);border-radius:12px;padding:12px 16px;margin-bottom:12px;display:grid;gap:6px}
.ident b.t{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.ident p{margin:0;font-size:15px;color:var(--muted)}
.ident input{width:100%!important;min-width:0}
.sendbox{display:grid;gap:8px}
.sendbox textarea{font:inherit;font-size:14px;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.sendbox .btn{justify-self:start}
.refbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.18)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;max-height:100vh;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px}
  .side .units,.side .foot,.side .overall{display:none}
  .side.open .units,.side.open .foot,.side.open .overall{display:grid}
  .side.open{max-height:85vh}
  .menu-btn{display:inline-block}
  .side .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  main{padding:20px 16px 60px}
  .phase{grid-template-columns:1fr}
}
</style>

<div class="app">
  <aside class="side" id="side">
    <div class="top">
      <div class="brand">Turing Kelebek<small>Çalışma rehberi · 9. sınıf</small></div>
      <button class="btn menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="unitList">Üniteler</button>
    </div>
    <div class="overall"><span id="ovText">İlerleme</span><div class="bar"><i id="ovBar" style="width:0%"></i></div></div>
    <ol class="units" id="unitList"></ol>
    <div class="foot">
      <span>İlerlemen yalnızca bu tarayıcıda saklanır.</span>
      <button class="btn" id="resetAll" type="button">İlerlemeyi sıfırla</button>
      <div id="resetConfirm" hidden class="msg warn">Bütün puanlar silinsin mi? <button class="btn" id="resetYes" type="button">Evet, sil</button> <button class="btn" id="resetNo" type="button">Vazgeç</button></div>
    </div>
  </aside>
  <main id="main"><div class="col" id="col"></div></main>
  <button class="btn primary refbtn" id="refOpen" type="button" aria-haspopup="dialog">Semboller ve sözlük</button>
  <dialog id="ref" aria-labelledby="refTitle">
    <div class="rh"><div class="ctrl" style="gap:6px"><b id="refTitle" style="font-family:var(--f-display);font-size:18px;margin-right:6px">Başvuru</b><button class="btn on" type="button" id="tabSym">Semboller</button><button class="btn" type="button" id="tabGl">Sözlük</button></div><button class="btn" type="button" id="refClose">Kapat</button></div>
    <div class="rb" id="refBody"></div>
  </dialog>
</div>

<script src="js/core.js?v=5"></script>
<script src="js/config.js?v=5"></script>
<script src="js/widgets-a.js?v=5"></script>
<script src="js/widgets-b.js?v=5"></script>
<script src="js/content.js?v=5"></script>
<script src="js/start.js?v=5"></script>
